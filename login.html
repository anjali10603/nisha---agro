<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farmer Login</title>

<style>

body{
margin:0;
font-family:Poppins,sans-serif;
background:#f4fff4;
}

.login-container{
max-width:500px;
margin:80px auto;
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

.login-container h1{
text-align:center;
color:#2e7d32;
margin-bottom:35px;
}

.input-box{
margin-bottom:25px;
}

.input-box label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

.input-box input{
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #ccc;
font-size:16px;
}

button{
width:100%;
padding:16px;
background:#2e7d32;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

</style>

</head>

<body>

<div class="login-container">

<h1>🌾 Farmer Login</h1>

<div class="input-box">

<label>📱 Mobile Number</label>

<input type="text" id="mobile">

</div>



<div class="input-box">

<label>🔒 Password</label>

<input type="password" id="password">

</div>



<button onclick="loginFarmer()">
Login
</button>

</div>

<script>

function loginFarmer(){

let savedMobile = localStorage.getItem("farmerMobile");

let savedPassword = localStorage.getItem("farmerPassword");

let mobile = document.getElementById("mobile").value;

let password = document.getElementById("password").value;

if(mobile === savedMobile && password === savedPassword){

alert("✅ Login Successful");

window.location.href = "index.html";

}

else{

alert("❌ Invalid Mobile Number or Password");

}

}

</script>

</body>

</html>
