<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Risk Reduction</title>

<style>

body{
font-family:Poppins,sans-serif;
margin:0;
background:#fff5f5;
color:black;
}

.container{
padding:50px 8%;
}

.card{
background:white;
padding:30px;
margin-top:30px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.1);
line-height:1.9;
}

h1{
font-size:45px;
color:#d32f2f;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table,th,td{
border:1px solid #ccc;
padding:15px;
text-align:center;
}

th{
background:#ffcdd2;
}

</style>

</head>

<body>

<div class="container">

<h1>🛡 Risk Reduction</h1>

<div class="card">

<p>
Smart farming technologies reduce farming losses and environmental risks.
</p>

<table>

<tr>
<th>Risk</th>
<th>Reduction</th>
</tr>

<tr>
<td>Water Loss</td>
<td>50%</td>
</tr>

<tr>
<td>Crop Damage</td>
<td>40%</td>
</tr>

<tr>
<td>Financial Loss</td>
<td>35%</td>
</tr>

</table>

</div>

</div>

</body>

</html>
