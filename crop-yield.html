<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Higher Crop Yield</title>

<link rel="stylesheet" href="style.css">

<style>

body{
font-family:Poppins,sans-serif;
margin:0;
background:#f5fff5;
}

.container{
padding:50px 8%;
}

.card{
background:white;
padding:30px;
margin-top:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
line-height:1.9;
}

h1{
color:#2e7d32;
font-size:45px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

table,th,td{
border:1px solid #ccc;
padding:15px;
text-align:center;
}

th{
background:#c8e6c9;
}

</style>

</head>

<body>

<div class="container">

<h1>🌾 Higher Crop Yield</h1>

<div class="card">

<p>
Efficient water management increases crop productivity

</p>

<table>

<tr>

<th>Year</th>

<th>Crop Yield</th>

</tr>

<tr>

<td>2022</td>

<td>65%</td>

</tr>

<tr>

<td>2023</td>

<td>80%</td>

</tr>

<tr>

<td>2024</td>

<td>95%</td>

</tr>

</table>

<img src="https://quickchart.io/chart?c={type:'bar',data:{labels:['2022','2023','2024'],datasets:[{label:'Crop Yield',data:[65,80,95]}]}}"
style="width:100%;border-radius:15px;">

</div>

</div>

</html>
