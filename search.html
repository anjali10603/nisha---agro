<h1>🌾 Smart Crop Search</h1>

<div class="search-hero">

<input
type="text"
id="cropInput"
placeholder="Enter crop name">

<button onclick="getCropData()">

Search

</button>

</div>

<div id="result"></div>

<script>

async function getCropData() {

const crop = document
.getElementById("cropInput")
.value
.trim();

if (!crop) {
alert("Please enter crop name");
return;
}
let cropImage = "";

if(crop.toLowerCase() === "wheat"){

cropImage =
"https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b";

}

else if(crop.toLowerCase() === "rice"){

cropImage =
"https://images.unsplash.com/photo-1536053294864-5b7f4bdfd1b7";

}

else if(crop.toLowerCase() === "cotton"){

cropImage =
"https://images.unsplash.com/photo-1599940824399-b87987ceb72a";

}

else if(crop.toLowerCase() === "maize"){

cropImage =
"https://images.unsplash.com/photo-1601593768799-76f1d7b4c1d6";

}

else if(crop.toLowerCase() === "sugarcane"){

cropImage =
"https://images.unsplash.com/photo-1625246333195-78d9c38ad449";

}
document.getElementById("result").innerHTML =
"<h2 style='color:white;'>Loading...</h2>";

try {

const response = await fetch(
`https://nisha-agro-api-2.onrender.com/crop/${crop}`
);

const data = await response.json();

document.getElementById("result").innerHTML = `

<img 
src="https://picsum.photos/600/400?random=${crop}"
style="
width:100%;
max-width:500px;
height:300px;
object-fit:cover;
border-radius:20px;
margin-bottom:20px;
display:block;
margin:auto;
">
<h2>🌾 ${crop.toUpperCase()}</h2>

<p style="white-space:pre-wrap;">
${data.answer}
</p>

</div>

`;

} catch (error) {

document.getElementById("result").innerHTML =
"<h2 style='color:red;'>Server Error</h2>";

console.log(error);

}

}

</script>



</script>
