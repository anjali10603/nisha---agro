<!DOCTYPE html>
<html>

<head>

<title>Crop Search</title>

<style>

body{
font-family:Arial;
background:#f5fff5;
padding:40px;
text-align:center;
}

.search-box{
margin-top:40px;
}

input{
padding:12px;
width:300px;
font-size:18px;
border:2px solid green;
border-radius:10px;
}

button{
padding:12px 20px;
font-size:18px;
background:green;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-left:10px;
}

#result{

margin-top:40px;
padding:20px;
background:white;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:left;
white-space:pre-wrap;

}

</style>

</head>

<body>

<h1>🌾 Smart Crop Search</h1>

<div class="search-box">

<input
type="text"
id="cropInput"
placeholder="Enter crop name">

<button onclick="getCropData()">

Search

</button>

</div>

<div id="result"></div>

<script>

async function getCropData() {

const crop =
document.getElementById("cropInput")
.value
.trim();

if(!crop){

alert("Please enter crop name");

return;

}

document.getElementById("result")
.innerHTML =
"<h2>Loading...</h2>";

try {

const response = await fetch(

`http://localhost:5000/crop/${crop}`

);

const data =
await response.json();

document.getElementById("result")
.innerHTML = `

<h2>🌾 ${crop.toUpperCase()}</h2>

<p>

${data.answer}

</p>

`;

} catch (error) {

document.getElementById("result")
.innerHTML =

"<h2 style='color:red;'>Server Error</h2>";

console.log(error);

}

}

</script>

</body>

</html>
